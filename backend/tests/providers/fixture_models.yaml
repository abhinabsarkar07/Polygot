# Test-only fixture config, isolated from the real app/providers/models.yaml
# so ModelRegistry's own behavior is tested independently of production data.
models:
  test-chat-model:
    provider: fake
    provider_model_id: test-provider-v1
    context_window: 100000
    max_output_tokens: 4096
    capabilities:
      streaming: true
      tools: true
      vision: false
      embeddings: false
    pricing:
      input_per_million: 3.0
      output_per_million: 15.0

  test-no-tools-model:
    provider: test-provider
    provider_model_id: test-provider-lite
    context_window: 32000
    capabilities:
      streaming: true
      tools: false
    pricing:
      input_per_million: 0.5
      output_per_million: 1.5
