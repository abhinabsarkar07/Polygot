# Model configuration -- the ONLY place model ids, capabilities, and
# pricing exist in this codebase. See docs/PROVIDER_NOTES.md for full
# sourcing detail, dates, and what still needs verification once CP-03
# actually builds each adapter against the live SDK.
#
# Every price and model id below was verified against an official
# first-party provider source on 2026-09-22 (see PROVIDER_NOTES.md for the
# exact URLs). Pricing is USD per 1,000,000 tokens. Prices change --
# Anthropic's own pricing page notes a scheduled Sonnet 5 price increase
# for 2026-09-01 that was cancelled after being announced -- so re-verify
# before trusting this file in anything beyond a take-home.

models:
  claude-sonnet:
    provider: anthropic
    provider_model_id: claude-sonnet-5
    context_window: 1000000
    max_output_tokens: 128000
    # CP-06: if Anthropic is rate-limited/erroring/timing out before any
    # output streams, retry this turn against Gemini instead of failing
    # outright. One example fallback, not a claim every model needs one.
    fallback_model_ids: [gemini-2.5-flash]
    capabilities:
      streaming: true
      tools: true
      vision: true
      embeddings: false
      reasoning: false
    pricing:
      input_per_million: 2.00
      output_per_million: 10.00
      # Cache read (hit) price; Anthropic also has separate 5m/1h cache
      # *write* prices ($2.50 / $4.00 per MTok) not modeled here -- this
      # config has one cached-input number, not a full caching cost model.
      cached_input_per_million: 0.20

  gpt-5.6-terra:
    provider: openai
    provider_model_id: gpt-5.6-terra
    context_window: 1050000
    max_output_tokens: 128000
    capabilities:
      streaming: true
      tools: true
      vision: true
      embeddings: false
      reasoning: false
    pricing:
      input_per_million: 2.00
      output_per_million: 12.00
      cached_input_per_million: 0.20

  gemini-2.5-flash:
    provider: gemini
    provider_model_id: gemini-2.5-flash
    context_window: 1000000
    # Max output tokens not confirmed from an official source yet -- left
    # unset rather than guessed. Populate during CP-03.
    max_output_tokens: null
    capabilities:
      streaming: true
      tools: true
      vision: true
      embeddings: false
      reasoning: false
    pricing:
      input_per_million: 0.30
      output_per_million: 2.50
      # Gemini context-caching pricing not confirmed from an official
      # source yet -- left unset rather than guessed. Populate during CP-03.
      cached_input_per_million: null

  # CP-05's one embedding model (see docs/PROVIDER_NOTES.md's new
  # "Embeddings" section for full sourcing). Chosen over Gemini/Anthropic
  # embeddings specifically because the OpenAI SDK is already installed
  # and already used for chat (app/providers/openai_adapter.py) -- no new
  # dependency, and OpenAIAdapter.embed() (see that file) is a direct
  # override of the Provider.embed() default CP-02 already defined,
  # reusing ProviderRegistry/credential-driven availability rather than a
  # second, parallel embedding-provider registry.
  text-embedding-3-small:
    provider: openai
    provider_model_id: text-embedding-3-small
    context_window: 8192
    dimension: 1536
    capabilities:
      streaming: false
      tools: false
      vision: false
      embeddings: true
      reasoning: false
    pricing:
      input_per_million: 0.02
      output_per_million: null
